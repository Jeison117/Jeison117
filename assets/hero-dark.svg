<svg xmlns="http://www.w3.org/2000/svg" width="840" height="216" viewBox="0 0 840 216" fill="none">
  <defs>
    <clipPath id="heroClip-dark">
      <rect width="840" height="216" rx="12" />
    </clipPath>
    <pattern id="dotGrid-dark" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#222227" />
    </pattern>
  </defs>

  <g clip-path="url(#heroClip-dark)">
    <rect width="840" height="216" rx="12" fill="#111113" />
    <rect x="36" y="0" width="32" height="2" fill="#22D3EE" />

    <!-- Left Column: Identity -->
    <rect x="36" y="34" width="7" height="7" rx="1.5" fill="#22D3EE" />
    <text x="51" y="41" fill="#8E8E98" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="600" letter-spacing="1.4">00 // @JEISON117</text>
    <rect x="176" y="32" width="6" height="10" rx="1" fill="#22D3EE">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.48;0.5;0.98;1" dur="1.1s" repeatCount="indefinite" />
    </rect>

    <text x="34" y="102" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-1.2">Jason Castillo</text>

    <text x="36" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500">
      <tspan fill="#FAFAFA" font-weight="600">AI Systems Engineer</tspan>
      <tspan fill="#22D3EE" font-weight="700">  ·  </tspan>
      <tspan fill="#A1A1AA">Automation Lover</tspan>
    </text>

    <!-- Bottom Hairline & Tabular Metadata -->
    <line x1="36" y1="158" x2="516" y2="158" stroke="#27272A" stroke-width="1" />

    <text x="36" y="182" fill="#8E8E98" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="500" letter-spacing="0.8">
      <tspan fill="#52525B">SYS </tspan><tspan fill="#A1A1AA" font-weight="600">WIN / LINUX</tspan>
      <tspan fill="#3F3F46">   |   </tspan>
      <tspan fill="#52525B">FOCUS </tspan><tspan fill="#A1A1AA" font-weight="600">AGENTS &amp; APPS</tspan>
      <tspan fill="#3F3F46">   |   </tspan>
      <tspan fill="#52525B">UNIT </tspan><tspan fill="#22D3EE" font-weight="700">117</tspan>
    </text>

    <!-- Right Column: Unit-117 Kinetic Viewport -->
    <rect x="548.5" y="22.5" width="259" height="171" rx="9" fill="#18181B" stroke="#27272A" stroke-width="1" />
    <rect x="556" y="30" width="244" height="156" rx="6" fill="url(#dotGrid-dark)" />
    <!-- Subtle Cyan Corner Reticles -->
    <path d="M548.5 34V28.5C548.5 25.2 551.2 22.5 554.5 22.5H560" stroke="#155E75" stroke-width="1.2" fill="none" />
    <path d="M796 22.5H801.5C804.8 22.5 807.5 25.2 807.5 28.5V34" stroke="#155E75" stroke-width="1.2" fill="none" />
    <path d="M548.5 182V187.5C548.5 190.8 551.2 193.5 554.5 193.5H560" stroke="#155E75" stroke-width="1.2" fill="none" />
    <path d="M796 193.5H801.5C804.8 193.5 807.5 190.8 807.5 187.5V182" stroke="#155E75" stroke-width="1.2" fill="none" />

    <!-- Viewport Corner Ticks & Labels -->
    <text x="564" y="42" fill="#52525B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="9.5" font-weight="600" letter-spacing="1">UNIT-117</text>
    <text x="752" y="42" fill="#52525B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="9.5" font-weight="600" letter-spacing="1">LIVE</text>
    <circle cx="786" cy="38.5" r="2.5" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite" />
    </circle>

    <!-- Precision Ruler Ticks -->
    <line x1="564" y1="176" x2="792" y2="176" stroke="#3F3F46" stroke-width="1" />
    <line x1="564" y1="172" x2="564" y2="176" stroke="#52525B" stroke-width="1" />
    <line x1="621" y1="173" x2="621" y2="176" stroke="#52525B" stroke-width="1" />
    <line x1="678" y1="171" x2="678" y2="176" stroke="#22D3EE" stroke-width="1.5" />
    <line x1="735" y1="173" x2="735" y2="176" stroke="#52525B" stroke-width="1" />
    <line x1="792" y1="172" x2="792" y2="176" stroke="#52525B" stroke-width="1" />

    <!-- Shadow beneath floating Unit-117 -->
    <ellipse cx="678" cy="157" rx="22" ry="3" fill="#3F3F46" opacity="0.55">
      <animate attributeName="rx" values="22;18;22" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3.2s" repeatCount="indefinite" />
    </ellipse>

    <!-- Floating Unit-117 Character -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4.5; 0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" dur="3.2s" repeatCount="indefinite" />

      <!-- Antenna -->
      <line x1="678" y1="73" x2="678" y2="85" stroke="#FAFAFA" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="678" cy="70" r="3.5" fill="#22D3EE" />
      <circle cx="678" cy="70" r="3.5" stroke="#22D3EE" stroke-width="1.2" fill="none" opacity="0">
        <animate attributeName="r" values="3.5;12" dur="2.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.75;0" dur="2.8s" repeatCount="indefinite" />
      </circle>

      <!-- Side Ear Bolts -->
      <rect x="636" y="103" width="5" height="14" rx="2" fill="#1C1C20" stroke="#FAFAFA" stroke-width="1.5" />
      <rect x="715" y="103" width="5" height="14" rx="2" fill="#1C1C20" stroke="#FAFAFA" stroke-width="1.5" />

      <!-- Head Chassis -->
      <rect x="641" y="85" width="74" height="52" rx="11" fill="#1C1C20" stroke="#FAFAFA" stroke-width="1.75" />

      <!-- OLED Visor -->
      <rect x="649" y="93" width="58" height="32" rx="6" fill="#09090B" stroke="#3F3F46" stroke-width="1" />

      <!-- Animated Eyes Group (Glancing Left/Right) -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; 4 0; 4 0; -4 0; -4 0; 0 0" keyTimes="0;0.24;0.30;0.48;0.54;0.74;0.82" dur="6.4s" repeatCount="indefinite" />

        <!-- Left Eye with Blink -->
        <rect x="665" y="102" width="5" height="11" rx="2.5" fill="#FAFAFA">
          <animate attributeName="height" values="11;11;1.5;11;11;1.5;11" keyTimes="0;0.86;0.88;0.90;0.94;0.96;0.98" dur="6.4s" repeatCount="indefinite" />
          <animate attributeName="y" values="102;102;107;102;102;107;102" keyTimes="0;0.86;0.88;0.90;0.94;0.96;0.98" dur="6.4s" repeatCount="indefinite" />
        </rect>

        <!-- Right Eye with Blink -->
        <rect x="686" y="102" width="5" height="11" rx="2.5" fill="#FAFAFA">
          <animate attributeName="height" values="11;11;1.5;11;11;1.5;11" keyTimes="0;0.86;0.88;0.90;0.94;0.96;0.98" dur="6.4s" repeatCount="indefinite" />
          <animate attributeName="y" values="102;102;107;102;102;107;102" keyTimes="0;0.86;0.88;0.90;0.94;0.96;0.98" dur="6.4s" repeatCount="indefinite" />
        </rect>

        <!-- Tiny Visor Smile / Telemetry Line -->
        <path d="M 673 117 Q 678 120 683 117" stroke="#22D3EE" stroke-width="1.6" stroke-linecap="round" fill="none" />
      </g>

      <!-- Bottom Chassis Detail -->
      <rect x="670" y="130" width="16" height="2.5" rx="1.25" fill="#3F3F46" />
    </g>

    <!-- Speech / Status Pill Cycling -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="3.2s" repeatCount="indefinite" />
      <rect x="730" y="61" width="38" height="21" rx="5" fill="#1C1C20" stroke="#3F3F46" stroke-width="1" />
      <text x="749" y="75" text-anchor="middle" fill="#FAFAFA" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="700">
        &gt;_
        <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.30;0.34;0.66;0.70;0.96;1" dur="7.5s" repeatCount="indefinite" />
      </text>
      <text x="749" y="75" text-anchor="middle" fill="#22D3EE" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="700" opacity="0">
        117
        <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.30;0.34;0.64;0.68;0.96;1" dur="7.5s" repeatCount="indefinite" />
      </text>
      <text x="749" y="75" text-anchor="middle" fill="#FAFAFA" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="700" opacity="0">
        hi!
        <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.30;0.64;0.68;0.72;0.96;1" dur="7.5s" repeatCount="indefinite" />
      </text>
    </g>
  </g>

  <!-- Crisp Outer Border -->
  <rect x="0.5" y="0.5" width="839" height="215" rx="11.5" stroke="#27272A" stroke-width="1" />
</svg>