<svg xmlns="http://www.w3.org/2000/svg" width="840" height="188" viewBox="0 0 840 188" fill="none">
  <!-- LEFT CARD: 01 CURRENT LOOP -->
  <g>
    <rect x="0.5" y="0.5" width="411" height="187" rx="11.5" fill="#111113" stroke="#27272A" stroke-width="1" />

    <text x="26" y="34" fill="#8E8E98" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" letter-spacing="1.2">01 · CURRENT LOOP</text>
    <rect x="330" y="21" width="56" height="20" rx="4" fill="#28150C" />
    <text x="358" y="34.5" text-anchor="middle" fill="#FF5C1A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="0.8">ACTIVE</text>

    <text x="26" y="68" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="-0.3">Multi-Agent Systems &amp; Apps</text>
    <text x="26" y="92" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400">Building &amp; experimenting with AI models</text>

    <!-- Kinetic State Pipeline Well -->
    <rect x="24.5" y="116.5" width="363" height="51" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1" />
    <line x1="56" y1="138" x2="344" y2="138" stroke="#3F3F46" stroke-width="1.5" stroke-dasharray="3 3" />

    
    <!-- Node THINK -->
    <circle cx="56" cy="138" r="4.5" fill="#18181B" stroke="#3F3F46" stroke-width="1.5">
      <animate attributeName="stroke" values="#3F3F46;#FF5C1A;#FF5C1A;#3F3F46" keyTimes="0;0;0.2;1" dur="6s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#18181B;#FF5C1A;#FF5C1A;#18181B" keyTimes="0;0;0.2;1" dur="6s" repeatCount="indefinite" />
    </circle>
    <text x="56" y="157" text-anchor="middle" fill="#52525B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="9.5" font-weight="600" letter-spacing="0.8">THINK
      <animate attributeName="fill" values="#52525B;#FAFAFA;#FAFAFA;#52525B" keyTimes="0;0;0.2;1" dur="6s" repeatCount="indefinite" />
    </text>
    <!-- Node BUILD -->
    <circle cx="152" cy="138" r="4.5" fill="#18181B" stroke="#3F3F46" stroke-width="1.5">
      <animate attributeName="stroke" values="#3F3F46;#FF5C1A;#FF5C1A;#3F3F46" keyTimes="0;0.25;0.45;1" dur="6s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#18181B;#FF5C1A;#FF5C1A;#18181B" keyTimes="0;0.25;0.45;1" dur="6s" repeatCount="indefinite" />
    </circle>
    <text x="152" y="157" text-anchor="middle" fill="#52525B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="9.5" font-weight="600" letter-spacing="0.8">BUILD
      <animate attributeName="fill" values="#52525B;#FAFAFA;#FAFAFA;#52525B" keyTimes="0;0.25;0.45;1" dur="6s" repeatCount="indefinite" />
    </text>
    <!-- Node BREAK -->
    <circle cx="248" cy="138" r="4.5" fill="#18181B" stroke="#3F3F46" stroke-width="1.5">
      <animate attributeName="stroke" values="#3F3F46;#FF5C1A;#FF5C1A;#3F3F46" keyTimes="0;0.5;0.72;1" dur="6s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#18181B;#FF5C1A;#FF5C1A;#18181B" keyTimes="0;0.5;0.72;1" dur="6s" repeatCount="indefinite" />
    </circle>
    <text x="248" y="157" text-anchor="middle" fill="#52525B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="9.5" font-weight="600" letter-spacing="0.8">BREAK!
      <animate attributeName="fill" values="#52525B;#FAFAFA;#FAFAFA;#52525B" keyTimes="0;0.5;0.72;1" dur="6s" repeatCount="indefinite" />
    </text>
    <!-- Node SHIP -->
    <circle cx="344" cy="138" r="4.5" fill="#18181B" stroke="#3F3F46" stroke-width="1.5">
      <animate attributeName="stroke" values="#3F3F46;#FF5C1A;#FF5C1A;#3F3F46" keyTimes="0;0.78;0.96;1" dur="6s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#18181B;#FF5C1A;#FF5C1A;#18181B" keyTimes="0;0.78;0.96;1" dur="6s" repeatCount="indefinite" />
    </circle>
    <text x="344" y="157" text-anchor="middle" fill="#52525B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="9.5" font-weight="600" letter-spacing="0.8">SHIP
      <animate attributeName="fill" values="#52525B;#FAFAFA;#FAFAFA;#52525B" keyTimes="0;0.78;0.96;1" dur="6s" repeatCount="indefinite" />
    </text>

    <!-- Traveling Packet (with playful micro-jitter on BREAK) -->
    <rect x="52" y="134" width="8" height="8" rx="2" fill="#FF5C1A">
      <animate attributeName="x" values="52;148;244;246;242;244;340;340;52" keyTimes="0;0.25;0.50;0.54;0.58;0.64;0.82;0.94;1" dur="6s" repeatCount="indefinite" />
      <animate attributeName="y" values="134;134;134;131;137;134;134;134;134" keyTimes="0;0.25;0.50;0.54;0.58;0.64;0.82;0.94;1" dur="6s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- RIGHT CARD: 02 WORKBENCH -->
  <g transform="translate(428, 0)">
    <rect x="0.5" y="0.5" width="411" height="187" rx="11.5" fill="#111113" stroke="#27272A" stroke-width="1" />

    <text x="26" y="34" fill="#8E8E98" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" letter-spacing="1.2">02 · WORKBENCH</text>

    <!-- Mini Ping-Pong Court (Top-Right) -->
    <rect x="308.5" y="22.5" width="76" height="44" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
    <line x1="346" y1="27" x2="346" y2="62" stroke="#3F3F46" stroke-width="1" stroke-dasharray="2 3" />

    <!-- Left Paddle -->
    <rect x="314" y="37" width="2.5" height="12" rx="1.25" fill="#FAFAFA">
      <animate attributeName="y" values="42;32;48;42" keyTimes="0;0.48;0.76;1" dur="3.6s" repeatCount="indefinite" />
    </rect>
    <!-- Right Paddle -->
    <rect x="375.5" y="37" width="2.5" height="12" rx="1.25" fill="#FAFAFA">
      <animate attributeName="y" values="32;48;36;32" keyTimes="0;0.50;0.82;1" dur="3.6s" repeatCount="indefinite" />
    </rect>
    <!-- Bouncing Ball -->
    <rect x="318" y="46" width="4" height="4" rx="1" fill="#FF5C1A">
      <animate attributeName="x" values="317;371;317" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="46;29;51;58;36;46" keyTimes="0;0.24;0.50;0.74;0.88;1" dur="3.6s" repeatCount="indefinite" />
    </rect>

    <text x="26" y="68" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="-0.3">Windows · Linux</text>
    <text x="26" y="92" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400">IDE: Google Antigravity, OpenCode</text>

    <!-- Kinetic OS Switcher Dock -->
    <rect x="24.5" y="116.5" width="363" height="51" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1" />

    <!-- Toggle Track -->
    <rect x="38" y="129" width="104" height="26" rx="5" fill="#111113" stroke="#27272A" stroke-width="1" />
    <!-- Sliding Active Pill -->
    <rect x="41" y="132" width="48" height="20" rx="3.5" fill="#FAFAFA">
      <animate attributeName="x" values="41;41;91;91;41" keyTimes="0;0.42;0.50;0.92;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" dur="5.6s" repeatCount="indefinite" />
    </rect>
    <text x="65" y="145.5" text-anchor="middle" fill="#111113" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="700">
      WIN
      <animate attributeName="fill" values="#111113;#111113;#8E8E98;#8E8E98;#111113" keyTimes="0;0.42;0.50;0.92;1" dur="5.6s" repeatCount="indefinite" />
    </text>
    <text x="115" y="145.5" text-anchor="middle" fill="#8E8E98" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="700">
      NIX
      <animate attributeName="fill" values="#8E8E98;#8E8E98;#111113;#111113;#8E8E98" keyTimes="0;0.42;0.50;0.92;1" dur="5.6s" repeatCount="indefinite" />
    </text>

    <!-- Terminal Prompt Readout -->
    <text x="158" y="145.5" fill="#8E8E98" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="500">
      <tspan fill="#FF5C1A" font-weight="700">~/</tspan><tspan fill="#A1A1AA">dev</tspan><tspan fill="#52525B"> · dual-os ready</tspan>
    </text>
    <rect x="293" y="137" width="6" height="10" rx="1" fill="#FF5C1A">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.48;0.5;0.98;1" dur="1.1s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>