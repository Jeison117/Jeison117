<svg width="850" height="210" viewBox="0 0 850 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="850" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#041218" />
      <stop offset="55%" stop-color="#071e29" />
      <stop offset="100%" stop-color="#0a2936" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(700 45) rotate(135) scale(340 220)">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentLine" x1="48" y1="0" x2="802" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="45%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#083344" stop-opacity="0" />
    </linearGradient>
    <clipPath id="cardClip">
      <rect width="850" height="210" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base & Glow -->
    <rect width="850" height="210" rx="16" fill="url(#bgGrad)" />
    <rect width="850" height="210" rx="16" fill="url(#glow)" />

    <!-- Minimalist Geometric Shapes (Right Side) -->
    <circle cx="755" cy="105" r="95" stroke="#0e4a5c" stroke-width="1" stroke-dasharray="4 6" opacity="0.65" />
    <circle cx="755" cy="105" r="62" stroke="#0891b2" stroke-width="1" opacity="0.45" />
    <path d="M 650 185 Q 720 135 850 155 L 850 210 L 650 210 Z" fill="#083344" opacity="0.35" />
    <circle cx="755" cy="105" r="4" fill="#22d3ee" opacity="0.9" />
    <circle cx="693" cy="105" r="2.5" fill="#06b6d4" opacity="0.7" />
    <circle cx="755" cy="43" r="2.5" fill="#06b6d4" opacity="0.7" />

    <!-- Status Pill -->
    <rect x="48" y="38" width="218" height="26" rx="13" fill="#083344" fill-opacity="0.7" stroke="#0e7490" stroke-width="1" />
    <circle cx="65" cy="51" r="4" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite" />
    </circle>
    <text x="78" y="55" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.2">AI SYSTEMS ENGINEERING</text>

    <!-- Main Name -->
    <text x="48" y="114" fill="#f0fdfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.5">Jason Castillo</text>

    <!-- Subtitle -->
    <text x="48" y="146" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400">
      <tspan fill="#cbd5e1">AI Agents</tspan>
      <tspan fill="#0891b2">  ·  </tspan>
      <tspan fill="#cbd5e1">LLMs</tspan>
      <tspan fill="#0891b2">  ·  </tspan>
      <tspan fill="#cbd5e1">Autonomous Systems</tspan>
    </text>

    <!-- Bottom Accent Line -->
    <rect x="48" y="172" width="754" height="2" rx="1" fill="url(#accentLine)" />
  </g>

  <!-- Outer Border -->
  <rect x="0.5" y="0.5" width="849" height="209" rx="15.5" stroke="#0e4a5c" stroke-opacity="0.85" />
</svg>
