  <text x="26" y="27" fill="#8E8E98" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="600" letter-spacing="1.2">04 · CONNECT</text>
